name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a022e7-wirelesspowertransfer
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agon-agent_2-9df68349
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agon-agent_2-9df68349/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Export static web app
        run: npx expo export -p web
        env:
          BASE_URL: /WirelessPowerTransfer

      - name: GitHub Pages SPA fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: agon-agent_2-9df68349/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
